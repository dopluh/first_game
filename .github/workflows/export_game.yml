name: Export Web
on: 
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  exports:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout game
      uses: actions/checkout@v6

    - name: Install Godot & Export
      # Use a verified community action like godot-ci
      uses: firebelley/godot-export@v8.0.0
      with:
        godot_executable_download_url: https://downloads.godotengine.org/?version=4.7&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
        godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.7&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
        relative_project_path: ./
        archive_output: true
